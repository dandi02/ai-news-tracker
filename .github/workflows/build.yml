name: Daily build

on:
  schedule:
    - cron: "17 5 * * *"   # daily 05:17 UTC (off-peak minute; crons can lag under load)
  workflow_dispatch: {}     # manual runs + admin-console "Re-scan now"

permissions:
  contents: write   # commit updated state/feed back to main
  pages: write      # deploy to GitHub Pages
  id-token: write   # required by actions/deploy-pages

concurrency:
  group: daily-build
  cancel-in-progress: false   # a dispatch during the cron run queues instead of colliding

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run pipeline
        run: python -m pipeline.run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit state back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data site/feed.xml
          git diff --cached --quiet || git commit -m "chore: feed update $(date -u +%F)"
          # rebase in case an admin committed sources/overrides mid-run
          git pull --rebase origin main
          git push origin main

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
